# /etc/wlan-guard.conf — site policy for wlan-guard.sh
# Sourced by the script on every invocation (cron, hotplug, manual), so the
# policy is consistent no matter how it is run.

# Treat an active DHCP lease as authorizing that device on the address the
# lease is actually for, in addition to static reservations. On a network where
# most clients are dynamic, this is what keeps the guard aimed at real address
# misuse rather than at every non-reserved device. Note that it authorizes the
# mac/ip PAIR, not the mac: a leaseholder that moves to some other address is
# still a candidate. Set to 0 to trust static reservations only.
ALLOW_ACTIVE_LEASES=1

# Only block an unknown device if it is actively transferring faster than
# this many kB/s. Idle / just-associated devices are left alone.
RATE_THRESHOLD_KB=30

# Throughput sample window in seconds (a run takes about this long only when
# there is a new unknown device to measure).
SAMPLE_SECONDS=4

# Pin the AP interfaces instead of auto-detecting (optional). This router:
# WLAN_IFACES="ra0 ra1 rax0 rax1"

# --- MQTT notifications (optional) -----------------------------------------
# Publish a JSON message every time an IP is blocked or unblocked. Each message
# carries an ISO-8601 UTC timestamp of the moment the state changed, e.g.:
#   topic:   openwrt/wlan-guard/blocked
#   payload: {"action":"blocked","ip":"192.168.4.155",
#             "reason":"address not granted to this device, active >30kB/s",
#             "time":"2026-07-24T18:05:12Z","router":"OpenWrt"}
# Requires the mosquitto-client package (mosquitto_pub). Off until MQTT_HOST is
# set. MQTT_TOPIC is the full topic prefix; the leaf is blocked/unblocked.
MQTT_TOPIC="home/wguard"   # -> home/wguard/blocked, home/wguard/unblocked

# MQTT_HOST="192.168.1.10"
# MQTT_PORT=1883
# MQTT_BASE="openwrt"
# Broker credentials belong on the router only: leave MQTT_USER/MQTT_PASS
# empty here so that nothing secret is ever committed.
# MQTT_USER=""
# MQTT_PASS=""
# MQTT_QOS=0
# MQTT_RETAIN=0        # 1 = broker retains the last message on each topic
